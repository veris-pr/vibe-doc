name: open-doc

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@docker-db-1:5432/opendoc
      REDIS_URL: redis://docker-redis-1:6379/1
      SECRET_KEY: dev-secret-key-change-in-production
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload
    networks:
      - docker_default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5273:5273"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --port 5273
    depends_on:
      - backend
    networks:
      - docker_default

networks:
  docker_default:
    external: true
